name: EnviCore
description: >-
  EnviCore is a Calgary, Alberta based sustainability and materials-technology
  company, backed by Techstars, that produces low-carbon supplementary
  cementitious materials for the mining and construction industries. Its
  low-temperature process repurposes industrial waste, mine tailings, clays, and
  pozzolans into valuable cement replacements, reducing CO2 emissions and
  supporting a circular economy. EnviCore does not publish a developer API, but
  its public website exposes an agentic surface: a published llms.txt and a live
  Wix Site MCP endpoint for AI-agent access to public site content.
